<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>تقویم شیفت و PM</title>
<meta name="theme-color" content="#1f5f8b">
<meta name="description" content="تقویم شمسی شیفت ۱۲ ساعته پرسنل و برنامه PM دستگاه‌ها">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
html{-webkit-text-size-adjust:100%}

/* Layout: sticky-free single column; top bar with tabs, then one working view at a time.
   Palette: cool aluminium greys, steel-blue accent, day=amber, night=indigo, semantic green/red. */
:root{
  --bg:#edf0f3; --surface:#ffffff; --surface2:#f4f6f8; --ink:#161b22; --ink2:#4b5663; --line:#d3dae1;
  --accent:#1f5f8b; --accent-ink:#ffffff;
  --day:#8a5a0c; --day-bg:#f6e7c6; --night:#3f4396; --night-bg:#e1e2f5; --off:#5d6875; --off-bg:#e6eaee;
  --good:#1c7248; --good-bg:#d9f0e3; --crit:#a93226; --crit-bg:#f7dedb; --warn:#8a5a0c; --warn-bg:#f6e7c6;
  --font:'Vazirmatn',Tahoma,system-ui,sans-serif; --display:'Lalezar','Vazirmatn',Tahoma,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12161b; --surface:#1a2027; --surface2:#222a33; --ink:#e8ecf0; --ink2:#a2adba; --line:#2f3944;
    --accent:#6bb0e0; --accent-ink:#0d1a24;
    --day:#efc06e; --day-bg:#3a2e14; --night:#aab0f0; --night-bg:#262846; --off:#a2adba; --off-bg:#262e37;
    --good:#5fc08c; --good-bg:#17342a; --crit:#f08a7e; --crit-bg:#3d1f1c; --warn:#efc06e; --warn-bg:#3a2e14;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12161b; --surface:#1a2027; --surface2:#222a33; --ink:#e8ecf0; --ink2:#a2adba; --line:#2f3944;
  --accent:#6bb0e0; --accent-ink:#0d1a24;
  --day:#efc06e; --day-bg:#3a2e14; --night:#aab0f0; --night-bg:#262846; --off:#a2adba; --off-bg:#262e37;
  --good:#5fc08c; --good-bg:#17342a; --crit:#f08a7e; --crit-bg:#3d1f1c; --warn:#efc06e; --warn-bg:#3a2e14;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink); font-family:var(--font); font-size:15px; line-height:1.7; direction:rtl;
  padding-block:12px 40px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  font-variant-numeric:tabular-nums;
}
.wrap{max-width:980px;margin-inline:auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3,p{margin:0}
h2{font-size:17px;font-weight:700}
h3{font-size:15px;font-weight:700}
small,.muted{color:var(--ink2)}
a{color:var(--accent)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px}
.brand{font-family:var(--display);font-size:26px;line-height:1.2}
.status{font-size:12px;padding:2px 10px;border-radius:4px;background:var(--off-bg);color:var(--off)}
.status.ok{background:var(--good-bg);color:var(--good)}
.status.bad{background:var(--crit-bg);color:var(--crit)}
.nav{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);padding-bottom:0}
.nav a{padding:8px 14px;text-decoration:none;color:var(--ink2);white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-1px}
.nav a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:700}

.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px;min-width:0}
.card.flat{background:var(--surface2)}
.stack{display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
.row.between{justify-content:space-between;align-items:center}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:2px;min-width:0}
.field label{font-size:12px;color:var(--ink2)}
input,select{padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);min-width:0;max-width:100%}
input[type="checkbox"]{width:20px;height:20px;padding:0;accent-color:var(--accent);flex:none}
.btn{padding:6px 12px;border:1px solid var(--line);background:var(--surface);border-radius:6px;cursor:pointer}
.btn:hover{background:var(--surface2)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.sm{padding:2px 8px;font-size:13px}
.btn.del.armed{background:var(--crit);border-color:var(--crit);color:#fff}
button:disabled,input:disabled,select:disabled{opacity:.55;cursor:not-allowed}

.chip{display:inline-block;font-size:12px;line-height:1.6;padding:0 8px;border-radius:4px;white-space:nowrap}
.sh-D{background:var(--day-bg);color:var(--day)}
.sh-N{background:var(--night-bg);color:var(--night)}
.sh-O{background:var(--off-bg);color:var(--off)}
.sh-L{background:var(--warn-bg);color:var(--warn)}
.ty-pm{background:var(--night-bg);color:var(--night)}
.ty-check{background:var(--off-bg);color:var(--off)}
.ty-maint{background:var(--day-bg);color:var(--day)}
.alert{background:var(--crit-bg);color:var(--crit);padding:2px 8px;border-radius:4px;font-size:13px}
.empty{padding:20px;border:1px dashed var(--line);border-radius:6px;color:var(--ink2);text-align:center}

.date{font-family:var(--display);font-size:clamp(30px,7vw,46px);line-height:1.25;font-weight:400}
.eyebrow{font-size:13px;color:var(--ink2)}
.shift-card{display:flex;flex-direction:column;gap:8px;border-inline-start:4px solid var(--line)}
.shift-card.D{border-inline-start-color:var(--day)}
.shift-card.N{border-inline-start-color:var(--night)}
.names{display:flex;flex-wrap:wrap;gap:4px 12px;margin:0;padding:0;list-style:none}
.names li small{margin-inline-start:4px}
.meter{height:8px;background:var(--off-bg);border-radius:4px;overflow:hidden}
.meter>i{display:block;height:100%;background:var(--good)}

.group{display:flex;flex-direction:column;gap:6px}
.group>h3{font-size:13px;color:var(--ink2);font-weight:500;border-bottom:1px solid var(--line);padding-bottom:2px}
.task{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);cursor:pointer}
.task:last-child{border-bottom:0}
.task .t-main{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.5}
.task.done .t-main b{text-decoration:line-through;color:var(--ink2);font-weight:400}
.task .t-late{font-size:12px;color:var(--crit)}

.cal-head{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center;font-size:12px;color:var(--ink2)}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cell{border:1px solid var(--line);background:var(--surface);border-radius:6px;min-height:72px;padding:4px;display:flex;flex-direction:column;gap:3px;text-align:start;cursor:pointer;min-width:0;overflow:hidden}
.cell.blank{visibility:hidden;border:0}
.cell.fri .dn{color:var(--crit)}
.cell.today{outline:2px solid var(--accent);outline-offset:-1px}
.cell.sel{background:var(--surface2);border-color:var(--accent)}
.cell .dn{font-size:13px;font-weight:700;line-height:1.3}
.cell .sh{display:flex;flex-direction:column;gap:2px}
.cell .sh i{display:block;font-style:normal;font-size:10px;line-height:1.5;padding:0 3px;border-radius:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell .sh .s-D{background:var(--day-bg);color:var(--day)}
.cell .sh .s-N{background:var(--night-bg);color:var(--night)}
.cell .pm{font-size:10px;color:var(--ink2);margin-top:auto;line-height:1.3}
.cell .pm.ok{color:var(--good)}
.cell .pm.late{color:var(--crit);font-weight:700}
@media (min-width:640px){
  .cell{min-height:92px;padding:6px}
  .cell .sh i{font-size:12px;padding:0 6px}
  .cell .pm{font-size:12px}
}

.list-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:8px 0;border-bottom:1px solid var(--line)}
.list-row:last-child{border-bottom:0}
.list-row .grow{flex:1;min-width:140px}
.scroll{overflow-x:auto}
.cyc{display:flex;flex-wrap:wrap;gap:4px}
.cyc button{border:0;border-radius:4px;padding:4px 10px;min-width:56px;cursor:pointer;text-align:center}
.cyc button small{display:block;font-size:10px;color:inherit;opacity:.8;line-height:1.2}
table.prev{border-collapse:collapse;font-size:12px;min-width:560px;width:100%}
table.prev th,table.prev td{padding:3px 4px;text-align:center;border-bottom:1px solid var(--line)}
table.prev th:first-child,table.prev td:first-child{text-align:start;white-space:nowrap}
table.prev td span{display:block;border-radius:3px;padding:0 2px}
table.prev th.tdy{color:var(--accent);font-weight:700}
.hint{font-size:13px;color:var(--ink2)}
@media (prefers-reduced-motion:no-preference){.meter>i{transition:width .3s}}

@font-face{font-family:'Vazirmatn';font-weight:400;font-display:swap;src:url(vendor/fonts/vazirmatn-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Vazirmatn';font-weight:500;font-display:swap;src:url(vendor/fonts/vazirmatn-latin-500-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Vazirmatn';font-weight:700;font-display:swap;src:url(vendor/fonts/vazirmatn-latin-700-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Vazirmatn';font-weight:400;font-display:swap;src:url(vendor/fonts/vazirmatn-arabic-400-normal.woff2) format('woff2');unicode-range:U+0600-06FF,U+0750-077F,U+0870-088E,U+0890-0891,U+0897-08E1,U+08E3-08FF,U+200C-200E,U+2010-2011,U+204F,U+2E41,U+FB50-FDFF,U+FE70-FE74,U+FE76-FEFC}
@font-face{font-family:'Vazirmatn';font-weight:500;font-display:swap;src:url(vendor/fonts/vazirmatn-arabic-500-normal.woff2) format('woff2');unicode-range:U+0600-06FF,U+0750-077F,U+0870-088E,U+0890-0891,U+0897-08E1,U+08E3-08FF,U+200C-200E,U+2010-2011,U+204F,U+2E41,U+FB50-FDFF,U+FE70-FE74,U+FE76-FEFC}
@font-face{font-family:'Vazirmatn';font-weight:700;font-display:swap;src:url(vendor/fonts/vazirmatn-arabic-700-normal.woff2) format('woff2');unicode-range:U+0600-06FF,U+0750-077F,U+0870-088E,U+0890-0891,U+0897-08E1,U+08E3-08FF,U+200C-200E,U+2010-2011,U+204F,U+2E41,U+FB50-FDFF,U+FE70-FE74,U+FE76-FEFC}
@font-face{font-family:'Lalezar';font-weight:400;font-display:swap;src:url(vendor/fonts/lalezar-arabic-400-normal.woff2) format('woff2')}

.login{max-width:380px;margin:24px auto;display:flex;flex-direction:column;gap:12px}
.login input{width:100%}
.err{color:var(--crit);font-size:13px;min-height:1.4em}
.top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
a.btn{text-decoration:none;display:inline-block;color:var(--ink)}
.btn[aria-current="page"]{border-color:var(--accent);color:var(--accent)}
.ms{position:relative;min-width:170px;max-width:280px}
.ms>summary{list-style:none;cursor:pointer;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);min-height:35px;display:flex;align-items:center;justify-content:space-between;gap:8px;line-height:1.5}
.ms>summary::-webkit-details-marker{display:none}
.ms>summary::after{content:"▾";color:var(--ink2);font-size:12px;flex:none}
.ms[open]>summary{border-color:var(--accent)}
.ms-t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.ms-panel{position:absolute;z-index:5;inset-inline-start:0;top:calc(100% + 4px);min-width:100%;max-width:min(90vw,320px);max-height:240px;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:4px;box-shadow:0 6px 18px rgba(0,0,0,.2)}
.ms .ms-opt{display:flex;gap:8px;align-items:center;padding:6px 8px;cursor:pointer;border-radius:4px;white-space:nowrap;font-size:14px;color:var(--ink)}
.ms .ms-opt:hover{background:var(--surface2)}
.ms-empty{padding:8px;color:var(--ink2);font-size:13px;white-space:normal}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{display:inline-flex;align-items:center;gap:6px;background:var(--surface2);border:1px solid var(--line);border-radius:4px;padding:2px 4px;padding-inline-start:10px}
.opt button{border:0;background:transparent;color:var(--ink2);cursor:pointer;padding:0 6px;border-radius:3px;font-size:14px;line-height:1.6}
.opt button:hover{background:var(--crit-bg);color:var(--crit)}
.opt button.armed{background:var(--crit);color:#fff}

.setup{max-width:560px;margin:24px auto;line-height:1.9}
.setup code{direction:ltr;unicode-bidi:isolate;background:var(--surface2);padding:0 4px;border-radius:3px}


.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{padding:6px 14px;border:1px solid var(--line);background:var(--surface);border-radius:6px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.t-rng{color:var(--night);font-size:12px}
/* ui-ux: هدف لمسی حداقل ۴۴px روی گوشی، فاصله ۸px، احترام به کاهش حرکت */
@media (pointer:coarse){
  .btn,.seg button,select,input:not([type=checkbox]){min-height:44px}
  .btn.sm{min-height:44px;padding-inline:12px}
  .task{min-height:48px;padding:8px 0}
  input[type="checkbox"]{width:26px;height:26px}
  .list-row{gap:8px 10px}
  .opt button{min-height:40px;min-width:40px}
  .ms-opt{min-height:44px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
.btn,.seg button,.cell,.task,select,summary{cursor:pointer}
/* v2 */
[hidden]{display:none!important}
textarea{font:inherit;color:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);min-width:0;max-width:100%;width:100%;resize:vertical}
textarea:disabled{opacity:.55}
.notice{position:fixed;inset-inline:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:20;max-width:560px;margin-inline:auto;padding:10px 14px;border-radius:6px;background:var(--ink);color:var(--bg);font-size:14px;box-shadow:0 6px 18px rgba(0,0,0,.3)}
.notice.bad{background:var(--crit);color:#fff}
.sh-W{background:var(--good-bg);color:var(--good)}
.ty-0{background:var(--night-bg);color:var(--night)}
.ty-1{background:var(--off-bg);color:var(--off)}
.ty-2{background:var(--day-bg);color:var(--day)}
.ty-3{background:var(--good-bg);color:var(--good)}
.rolegrp{display:flex;flex-direction:column;gap:2px;padding:4px 0}
.rg-h{display:flex;gap:8px;align-items:baseline;font-size:13px;color:var(--ink2)}
.rg-h b{color:var(--ink);font-weight:600}
.shift-card.D{border-top:3px solid var(--day)}
.shift-card.N{border-top:3px solid var(--night)}
.group.sub>h3{font-size:12px}
.t-desc{color:var(--ink2);font-size:12px}
.t-by{color:var(--good);font-size:12px}
.ovr{color:var(--warn)}
.opt button.ed{font-size:12px}
.opt button.ed:hover{background:var(--surface2);color:var(--accent)}
.btn.del:hover{background:var(--crit-bg);color:var(--crit)}
.scroll{overflow-x:auto}
</style>
</head>
<body>
<div class="wrap" lang="fa" dir="rtl">
  <header class="top">
    <div class="brand">تقویم شیفت و PM</div>
    <div class="top-actions"><span id="status" class="status">در حال بارگذاری…</span><a class="btn sm" id="homeBtn" href="#home" hidden>خانه</a><a class="btn sm" id="manageBtn" href="#manage" hidden>مدیریت</a><a class="btn sm" id="settingsBtn" href="#settings" hidden>تنظیمات</a><button class="btn sm" id="signout" hidden>خروج</button></div>
  </header>
  
  <main id="app" class="stack"></main>
  <div id="notice" class="notice" role="status" hidden></div>
</div>
<script src="config.js"></script>
<script src="vendor/supabase.js"></script>
<script>
(function(){
'use strict';
//<jal>
var BREAKS=[-61,9,38,199,426,686,756,818,1111,1181,1210,1635,2060,2097,2192,2262,2324,2394,2456,3178];
function div(a,b){return ~~(a/b)}
function mod(a,b){return a-~~(a/b)*b}
function jalCal(jy,withoutLeap){
  var bl=BREAKS.length,gy=jy+621,leapJ=-14,jp=BREAKS[0],jm,jump=0,leap,leapG,march,n,i;
  for(i=1;i<bl;i+=1){jm=BREAKS[i];jump=jm-jp;if(jy<jm)break;leapJ=leapJ+div(jump,33)*8+div(mod(jump,33),4);jp=jm}
  n=jy-jp;
  leapJ=leapJ+div(n,33)*8+div(mod(n,33)+3,4);
  if(mod(jump,33)===4&&jump-n===4)leapJ+=1;
  leapG=div(gy,4)-div((div(gy,100)+1)*3,4)-150;
  march=20+leapJ-leapG;
  if(withoutLeap)return{gy:gy,march:march};
  if(jump-n<6)n=n-jump+div(jump+4,33)*33;
  leap=mod(mod(n+1,33)-1,4);
  if(leap===-1)leap=4;
  return{leap:leap,gy:gy,march:march};
}
function g2d(gy,gm,gd){
  var d=div((gy+div(gm-8,6)+100100)*1461,4)+div(153*mod(gm+9,12)+2,5)+gd-34840408;
  d=d-div(div(gy+100100+div(gm-8,6),100)*3,4)+752;
  return d;
}
function d2g(jdn){
  var j=4*jdn+139361631;
  j=j+div(div(4*jdn+183187720,146097)*3,4)*4-3908;
  var i=div(mod(j,1461),4)*5+308;
  var gd=div(mod(i,153),5)+1,gm=mod(div(i,153),12)+1,gy=div(j,1461)-100100+div(8-gm,6);
  return{gy:gy,gm:gm,gd:gd};
}
function j2d(jy,jm,jd){
  var r=jalCal(jy,true);
  return g2d(r.gy,3,r.march)+(jm-1)*31-div(jm,7)*(jm-7)+jd-1;
}
function d2j(jdn){
  var gy=d2g(jdn).gy,jy=gy-621,r=jalCal(jy,false),jdn1f=g2d(gy,3,r.march),jd,jm,k;
  k=jdn-jdn1f;
  if(k>=0){
    if(k<=185){jm=1+div(k,31);jd=mod(k,31)+1;return{jy:jy,jm:jm,jd:jd}}
    k-=186;
  }else{
    jy-=1;k+=179;
    if(r.leap===1)k+=1;
  }
  jm=7+div(k,30);jd=mod(k,30)+1;
  return{jy:jy,jm:jm,jd:jd};
}
function satIdx(jdn){return mod(jdn+2,7)}
function monthLen(jy,jm){return (jm===12?j2d(jy+1,1,1):j2d(jy,jm+1,1))-j2d(jy,jm,1)}
//</jal>

var MONTHS=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
var WD=['شنبه','یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه'];
var WDS=['ش','ی','د','س','چ','پ','ج'];
var SHL={D:'روز',N:'شب',W:'روزکار',O:'استراحت',L:'مرخصی'};
var FREQ={daily:'روزانه',weekly:'هفتگی',monthly:'ماهانه',once:'یک روز مشخص',range:'یک‌بار در یک بازه‌ی زمانی'};
var EVERY=[[1,'هر ماه'],[2,'هر ۲ ماه'],[3,'هر ۳ ماه'],[4,'هر ۴ ماه'],[6,'هر ۶ ماه'],[12,'سالی یک بار']];
var STABS=[['staff','پرسنل'],['roles','سمت‌ها'],['machines','دستگاه‌ها'],['lists','نوع کار و سالن'],['shifts','چرخه شیفت']];
var SHOPT=[['any','فرقی ندارد'],['D','شیفت روز'],['N','شیفت شب'],['both','هر شیفت (جدا برای روز و شب)']];
var SHTXT={any:'',D:'شیفت روز',N:'شیفت شب',both:'هر شیفت'};
var VIEWS_ORDER=['home','manage','settings'];
var OLD_TYPES={pm:'PM',check:'کنترل',maint:'نگهداری'};
var MS_PH='انتخاب سمت (اختیاری)';

var $=function(s){return document.querySelector(s)};
var fa=function(s){return String(s).replace(/\d/g,function(d){return '۰۱۲۳۴۵۶۷۸۹'[d]})};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var pad=function(n){return String(n).padStart(2,'0')};
var uid=function(){return Math.random().toString(36).slice(2,9)};
var clone=function(o){return JSON.parse(JSON.stringify(o))};
var app=$('#app');

/* ---------- داده‌ی پیش‌فرض و نرمال‌سازی ---------- */
function defaults(){
  return{
    cycle:'DDNNOOOO',
    anchor:{y:1405,m:1,d:1},
    teams:[{id:'ta',name:'الف',off:0},{id:'tb',name:'ب',off:2},{id:'tc',name:'ج',off:4},{id:'td',name:'د',off:6}],
    staff:[],machines:[],tasks:[],
    lists:{roles:['اپراتور','سرپرست شیفت','تعمیرکار'],halls:['سالن نورد فویل','سالن سپراتور'],types:['PM','کنترل','نگهداری']}
  };
}
function normalize(d){
  var b=defaults(),o=Object.assign({},b,d||{});
  ['teams','staff','machines','tasks'].forEach(function(k){if(!Array.isArray(o[k]))o[k]=b[k]});
  if(typeof o.cycle!=='string'||o.cycle.length<2)o.cycle=b.cycle;
  if(!o.anchor||!o.anchor.y)o.anchor=b.anchor;
  o.lists=Object.assign({},b.lists,(d&&d.lists)||{});
  ['roles','halls','types'].forEach(function(k){if(!Array.isArray(o.lists[k]))o.lists[k]=b.lists[k].slice()});
  o.staff=o.staff.map(function(x){
    x=Object.assign({},x);
    if(!Array.isArray(x.roles)){x.roles=x.role?[x.role]:[];}
    delete x.role;
    if(x.kind!=='day')x.kind='shift';
    return x;
  });
  o.machines=o.machines.map(function(m){
    m=Object.assign({},m);
    if(!m.hall||m.hall==='بدون سالن')m.hall='';
    return m;
  });
  o.tasks=o.tasks.map(function(t){
    t=Object.assign({},t);
    if(OLD_TYPES[t.type])t.type=OLD_TYPES[t.type];
    if(!t.shift)t.shift='any';
    if(t.desc==null)t.desc='';
    if(t.freq==='monthly'&&!(+t.every>0))t.every=1;
    return t;
  });
  return o;
}

var now=new Date();
var todayJ=g2d(now.getFullYear(),now.getMonth()+1,now.getDate());
var tj=d2j(todayJ);
var cfg=normalize(),monthState={done:{},ovr:{}};
var cur={jy:tj.jy,jm:tj.jm},selJ=todayJ,view='home',homeTab='today',setTab='staff',extra={};
var canWrite=false,loadedCfg=false,slow=false,errMsg='',dirty=false,edit=null;
var anchorJ=0;
function calcAnchor(){try{anchorJ=j2d(+cfg.anchor.y,+cfg.anchor.m,+cfg.anchor.d)}catch(e){anchorJ=0}}
calcAnchor();

function monthId(jy,jm){return 'm-'+jy+'-'+pad(jm)}
function teamOf(id){return cfg.teams.find(function(t){return t.id===id})}
function machineOf(id){return cfg.machines.find(function(m){return m.id===id})}
function rolesOf(s){return Array.isArray(s.roles)?s.roles:(s.role?[s.role]:[])}
function teamShift(t,j){
  var c=cfg.cycle,ch=c[mod(j-anchorJ+(+t.off||0),c.length)];
  return ch==='D'||ch==='N'?ch:'O';
}
function ovrOf(j,sid){
  var x=d2j(j);
  if(x.jy!==cur.jy||x.jm!==cur.jm)return '';
  return monthState.ovr[x.jd+'_'+sid]||'';
}
function staffDay(j){
  var order={D:0,N:1,W:2,O:3,L:4};
  return cfg.staff.map(function(s){
    var t=teamOf(s.team),base;
    if(s.kind==='day')base=(satIdx(j)===6)?'O':'W';
    else base=t?teamShift(t,j):'O';
    var o=ovrOf(j,s.id);
    return{s:s,t:t,base:base,o:o,eff:o||base};
  }).sort(function(a,b){return order[a.eff]-order[b.eff]||a.s.name.localeCompare(b.s.name,'fa')});
}
function dj(o){if(!o||!o.y)return null;try{return j2d(+o.y,+o.m,+o.d)}catch(e){return null}}
function curDoc(){return monthId(cur.jy,cur.jm)}
function stateFor(id){if(id===curDoc())return monthState;return extra[id]||(extra[id]={done:{},ovr:{}})}
function docOf(t){
  if(t.freq==='once'&&t.date&&t.date.y)return monthId(+t.date.y,+t.date.m);
  if(t.freq==='range'&&t.from&&t.from.y)return monthId(+t.from.y,+t.from.m);
  return curDoc();
}
function doneKey(t,jd,sk){return t.id+'_'+(t.freq==='range'?'r':jd)+(sk?'_'+sk:'')}
function doneVal(t,jd,sk){return stateFor(docOf(t)).done[doneKey(t,jd,sk)]}
function doneJ(v){
  if(!v||typeof v!=='object'||!v.at)return null;
  var d=new Date(v.at);if(isNaN(d))return null;
  return g2d(d.getFullYear(),d.getMonth()+1,d.getDate());
}
/* کارهای سررسید یک روز؛ هر مورد یک «نمونه» است: {t, sk, rng} که sk شیفت مسئول است ('' یعنی کل روز)
   کار «بازه‌ای» هر روز در بازه دیده می‌شود تا انجام شود؛ بعد فقط در روز انجامش می‌ماند. */
function tasksDue(j){
  var x=d2j(j),len=monthLen(x.jy,x.jm),w=satIdx(j),out=[];
  cfg.tasks.forEach(function(t){
    var hit=false,rng=false,f=t.freq;
    if(f==='once'){var o=dj(t.date);hit=(o!==null&&o===j)}
    else if(f==='range'){var a=dj(t.from),b=dj(t.to);hit=(a!==null&&b!==null&&j>=a&&j<=b);rng=true}
    else{
      var sj=dj(t.start);
      if(sj!==null&&j<sj)return;
      if(f==='daily')hit=true;
      else if(f==='weekly')hit=(+t.weekday===w);
      else if(f==='monthly'){
        hit=(Math.min(+t.monthDay||1,len)===x.jd);
        var ev=+t.every||1;
        if(hit&&ev>1&&sj!==null){var s0=d2j(sj);hit=mod((x.jy*12+x.jm)-(s0.jy*12+s0.jm),ev)===0}
      }
    }
    if(!hit)return;
    var sh=t.shift||'any',sks=sh==='both'?['D','N']:(sh==='D'||sh==='N'?[sh]:['']);
    sks.forEach(function(sk){
      if(rng){
        var dv=doneVal(t,x.jd,sk);
        if(dv&&doneJ(dv)!==j)return;
        out.push({t:t,sk:sk,rng:true,last:j===dj(t.to)});
      }else out.push({t:t,sk:sk});
    });
  });
  return out;
}
/* شمارش برای آمار: کار بازه‌ای فقط یک‌بار حساب می‌شود (روز انجام، یا روز آخر بازه اگر انجام نشده) */
function inst(it,j){
  var x=d2j(j),dv=doneVal(it.t,x.jd,it.sk);
  if(it.rng){if(dv)return{due:1,done:1};return it.last?{due:1,done:0}:{due:0,done:0}}
  return{due:1,done:dv?1:0};
}
function fmtDate(j){var x=d2j(j);return WD[satIdx(j)]+' '+fa(x.jd)+' '+MONTHS[x.jm-1]+' '+fa(x.jy)}
function fmtStart(s){return s&&s.y?fa(s.d)+' '+MONTHS[s.m-1]+' '+fa(s.y):''}
function shiftChip(ch){return '<span class="chip sh-'+ch+'">'+SHL[ch]+'</span>'}
function teamNames(j,ch){
  var n=cfg.teams.filter(function(t){return teamShift(t,j)===ch}).map(function(t){return t.name});
  return n.join('،')||'—';
}
function count(rows,ch){return rows.filter(function(r){return r.eff===ch}).length}
function typeClass(t){var i=cfg.lists.types.indexOf(t);return 'ty-'+(i<0?1:i%4)}
function timeFa(iso){try{return new Date(iso).toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'})}catch(e){return ''}}

/* ---------- اعلان ---------- */
var noticeT=null;
function notify(msg,bad){
  var n=$('#notice');if(!n)return;
  n.textContent=msg;n.className='notice'+(bad?' bad':'');n.hidden=false;
  clearTimeout(noticeT);noticeT=setTimeout(function(){n.hidden=true},7000);

/* ---------- ذخیره‌سازی ----------
   منبع اصلی داده سرور (Supabase) است. روی گوشی فقط دو چیز می‌ماند:
   یک کپی برای نمایش آفلاین و صف تیک‌هایی که هنوز به سرور نرسیده‌اند. با خروج از حساب هر دو پاک می‌شوند. */
var CFGKEY='config';
var sb=null,session=null,online=navigator.onLine!==false,cfgVer=null,cfgSaving=0,outbox=[],lastSync=null,flushing=false,forceOut=false;
var CFGKEYS=window.APP_CONFIG||{};
var ch=null,pollT=null;
function lsSet(k,v){try{localStorage.setItem('shiftcal:'+k,JSON.stringify(v))}catch(e){}}
function lsGet(k){try{var v=localStorage.getItem('shiftcal:'+k);return v?JSON.parse(v):null}catch(e){return null}}
function lsClear(){try{Object.keys(localStorage).filter(function(k){return k.indexOf('shiftcal:')===0}).forEach(function(k){localStorage.removeItem(k)})}catch(e){}}
function loadOutbox(){var o=lsGet('outbox');outbox=Array.isArray(o)?o:[]}
function saveOutbox(){lsSet('outbox',outbox)}
function cacheCfg(){lsSet(CFGKEY,{data:cfg,ver:cfgVer})}
function cacheMonth(id){id=id||curDoc();lsSet(id,stateFor(id))}
function isNetErr(e){return !!e&&(!e.code||e.code==='PGRST301'||e.code==='PGRST303')}
function userName(){return session&&session.user&&session.user.email?session.user.email.split('@')[0]:''}

function toMonthState(d){
  var s={done:{},ovr:{}};
  Object.keys(d||{}).forEach(function(k){
    if(k.indexOf('d:')===0)s.done[k.slice(2)]=d[k];
    else if(k.indexOf('o:')===0)s.ovr[k.slice(2)]=d[k];
  });
  return s;
}
function applyOp(st,op){
  Object.keys(op.set||{}).forEach(function(k){
    if(k.indexOf('d:')===0)st.done[k.slice(2)]=op.set[k];
    else if(k.indexOf('o:')===0)st.ovr[k.slice(2)]=op.set[k];
  });
  (op.del||[]).forEach(function(k){
    if(k.indexOf('d:')===0)delete st.done[k.slice(2)];
    else if(k.indexOf('o:')===0)delete st.ovr[k.slice(2)];
  });
}
function fail(e){
  errMsg=(e&&(e.code==='42501'||/row-level security|permission/i.test(e.message||'')))?'readonly':'error';
  renderTop();
}

/* تیک‌ها و تغییر شیفت‌ها: اول در صف ثبت می‌شوند و بعد به سرور می‌روند (آفلاین هم کار می‌کند) */
function patchMonth(set,del,id){
  id=id||curDoc();
  outbox.push({id:id,set:set||{},del:del||[]});
  saveOutbox();cacheMonth(id);renderTop();flush();
}
function flush(){
  if(flushing||!sb||!session||!outbox.length)return Promise.resolve();
  flushing=true;
  function step(){
    if(!outbox.length){flushing=false;errMsg='';online=true;lastSync=new Date();renderTop();return Promise.resolve()}
    var op=outbox[0];
    return sb.rpc('shift_patch',{p_id:op.id,p_set:op.set,p_del:op.del}).then(function(r){
      if(r.error){
        if(isNetErr(r.error)){flushing=false;online=false;renderTop();return}
        outbox.shift();saveOutbox();fail(r.error);
        notify('یک تغییر ذخیره نشد: دسترسی نوشتن ندارید.',true);
        return step();
      }
      outbox.shift();saveOutbox();return step();
    },function(){flushing=false;online=false;renderTop()});
  }
  return step();
}

/* تنظیمات (پرسنل، دستگاه، کارها …): فقط آنلاین، با بررسی تداخل. اگر کس دیگری هم‌زمان تغییر داده باشد، روی تغییر او نمی‌نویسیم. */
function mutate(fn){
  if(!canWrite)return false;
  if(!online||!loadedCfg){notify('این تغییر نیاز به اینترنت و اتصال به سرور دارد.',true);return false}
  var backup=clone(cfg);
  fn();calcAnchor();edit=null;render(true);
  saveCfg(backup);
  return true;
}
function saveCfg(backup){
  if(!sb||!session)return;
  cfgSaving++;
  var payload=clone(cfg),q;
  if(cfgVer)q=sb.from('shift_kv').update({data:payload}).eq('id','config').eq('updated_at',cfgVer).select('updated_at');
  else q=sb.from('shift_kv').insert({id:'config',data:payload}).select('updated_at');
  q.then(function(r){
    cfgSaving--;
    if(r.error&&r.error.code!=='23505'){
      if(isNetErr(r.error)){online=false;cfg=backup;calcAnchor();notify('اینترنت قطع بود و تغییر ذخیره نشد. دوباره انجام دهید.',true)}
      else{fail(r.error);cfg=backup;calcAnchor();notify('تغییر ذخیره نشد: دسترسی نوشتن ندارید یا خطایی رخ داد.',true)}
      render(true);return;
    }
    if(r.error||!r.data||!r.data.length){
      notify('کس دیگری هم‌زمان تنظیمات را تغییر داده بود. نسخه‌ی جدید بارگذاری شد؛ تغییر خود را دوباره انجام دهید.',true);
      cfg=backup;loadCfg(true).then(function(){render(true)},function(){render(true)});return;
    }
    cfgVer=r.data[0].updated_at;cacheCfg();errMsg='';lastSync=new Date();renderTop();
  },function(){cfgSaving--;online=false;cfg=backup;calcAnchor();notify('اینترنت قطع بود و تغییر ذخیره نشد.',true);render(true)});
}
function loadCfg(force){
  return sb.from('shift_kv').select('data,updated_at').eq('id','config').maybeSingle().then(function(r){
    if(r.error)throw r.error;
    if(!cfgSaving||force){cfg=normalize(r.data?r.data.data:null);cfgVer=r.data?r.data.updated_at:null;calcAnchor();cacheCfg()}
    loadedCfg=true;slow=false;online=true;errMsg='';lastSync=new Date();
  });
}
function loadMonth(){
  var id=monthId(cur.jy,cur.jm);
  return sb.from('shift_kv').select('data').eq('id',id).maybeSingle().then(function(r){
    if(r.error)throw r.error;
    if(id!==monthId(cur.jy,cur.jm))return;
    var st=toMonthState(r.data?r.data.data:null);
    outbox.forEach(function(op){if(op.id===id)applyOp(st,op)});
    monthState=st;cacheMonth();
  });
}
function neededDocs(){
  var s={},c=curDoc();
  cfg.tasks.forEach(function(t){if(t.freq==='once'||t.freq==='range'){var id=docOf(t);if(id!==c)s[id]=1}});
  return Object.keys(s).slice(0,24);
}
function loadExtra(){
  return Promise.all(neededDocs().map(function(id){
    return sb.from('shift_kv').select('data').eq('id',id).maybeSingle().then(function(r){
      if(r.error)throw r.error;
      var st=toMonthState(r.data?r.data.data:null);
      outbox.forEach(function(op){if(op.id===id)applyOp(st,op)});
      extra[id]=st;lsSet(id,st);
    });
  }));
}
function hydrateExtra(){neededDocs().forEach(function(id){var l=lsGet(id);if(l&&l.done&&!extra[id])extra[id]=l})}
function refresh(){
  if(!sb||!session)return Promise.resolve();
  return loadCfg().then(function(){return Promise.all([loadMonth(),loadExtra()])}).then(function(){render()},function(){online=false;if(!loadedCfg)slow=true;renderTop()});
}
function watchMonth(){
  var l=lsGet(monthId(cur.jy,cur.jm));
  monthState=l&&l.done?l:{done:{},ovr:{}};
  hydrateExtra();
  if(sb&&session)loadMonth().then(function(){render()},function(){});
}
function gotoMonth(jy,jm,sel){
  cur={jy:jy,jm:jm};selJ=sel;watchMonth();render(true);
}
function subscribe(){
  if(ch){try{sb.removeChannel(ch)}catch(e){}ch=null}
  ch=sb.channel('shift-kv').on('postgres_changes',{event:'*',schema:'public',table:'shift_kv'},function(p){
    var row=p.new;if(!row||!row.id)return;
    if(row.id==='config'){if(!cfgSaving){cfg=normalize(row.data);cfgVer=row.updated_at||cfgVer;calcAnchor();cacheCfg();render()}}
    else{
      var st=toMonthState(row.data);
      outbox.forEach(function(op){if(op.id===row.id)applyOp(st,op)});
      if(row.id===curDoc()){monthState=st;cacheMonth()}else extra[row.id]=st;
      render();
    }
  }).subscribe();
}
function startSession(s){
  session=s;authErr='';
  if(!s){
    if(ch){try{sb.removeChannel(ch)}catch(e){}ch=null}
    clearInterval(pollT);canWrite=false;loadedCfg=false;render(true);return;
  }
  var cw=lsGet('role');canWrite=!!(cw&&cw.uid===s.user.id&&cw.w);
  loadOutbox();
  sb.from('shift_editors').select('user_id').eq('user_id',s.user.id).maybeSingle().then(function(r){
    if(r.error)return;
    canWrite=!!r.data;lsSet('role',{uid:s.user.id,w:canWrite});render(true);
  },function(){});
  flush().then(refresh);subscribe();
  clearInterval(pollT);pollT=setInterval(function(){if(!document.hidden)flush().then(refresh)},90000);
}
var authErr='';
function signIn(){
  var em=val('li-email'),pw=document.getElementById('li-pass').value;
  if(!em||!pw){authErr='ایمیل و رمز عبور را وارد کنید.';render(true);return}
  sb.auth.signInWithPassword({email:em,password:pw}).then(function(r){
    if(r.error){authErr='ایمیل یا رمز عبور درست نیست.';render(true)}
  },function(){authErr='اتصال به سرور برقرار نشد. اینترنت را بررسی کنید.';render(true)});
}
function signOut(){
  flush().then(function(){
    if(outbox.length&&!forceOut){
      forceOut=true;
      notify('تغییرهای ارسال‌نشده‌ای روی این گوشی هست. اگر باز هم «خروج» بزنید، حذف می‌شوند.',true);
      return;
    }
    forceOut=false;outbox=[];lsClear();cfg=normalize();monthState={done:{},ovr:{}};cfgVer=null;
    sb.auth.signOut();
  });
}

/* ---------- اجزای مشترک رابط ---------- */
function msHtml(id,opts,sel){
  var all=opts.slice();sel.forEach(function(x){if(all.indexOf(x)<0)all.push(x)});
  var h='<details class="ms" data-ms="'+esc(id)+'"><summary aria-label="سمت"><span class="ms-t">'+esc(sel.length?sel.join('، '):MS_PH)+'</span></summary><div class="ms-panel">';
  if(!all.length)h+='<div class="ms-empty">سمتی تعریف نشده است. از «تنظیمات» اضافه کنید.</div>';
  all.forEach(function(o){
    h+='<label class="ms-opt"><input type="checkbox" value="'+esc(o)+'" data-act="msform"'+(sel.indexOf(o)>=0?' checked':'')+'><span>'+esc(o)+'</span></label>';
  });
  return h+'</div></details>';
}
function msChecked(dt){return [].map.call(dt.querySelectorAll('input[type=checkbox]:checked'),function(i){return i.value})}
function opt(v,t,sel){return '<option value="'+esc(v)+'"'+(sel?' selected':'')+'>'+esc(t)+'</option>'}
function dis(){return canWrite?'':' disabled'}
function editBtns(kind,id){
  return canWrite?'<button class="btn sm" data-act="edit" data-kind="'+kind+'" data-id="'+esc(id)+'">ویرایش</button><button class="btn sm del" data-act="del" data-kind="'+kind+'" data-id="'+esc(id)+'">حذف</button>':'';
}
function isEdit(kind,id){return edit&&edit.kind===kind&&edit.id===id}
function allHalls(){
  var a=cfg.lists.halls.slice();
  cfg.machines.forEach(function(m){if(m.hall&&a.indexOf(m.hall)<0)a.push(m.hall)});
  return a;
}

/* ---------- امروز ---------- */
function roleGroups(rows){
  var g={},order=cfg.lists.roles;
  rows.forEach(function(r){var rs=rolesOf(r.s);if(!rs.length)rs=['بدون سمت'];rs.forEach(function(x){(g[x]=g[x]||[]).push(r)})});
  var keys=Object.keys(g).sort(function(a,b){
    if(a==='بدون سمت')return 1;if(b==='بدون سمت')return -1;
    var ia=order.indexOf(a),ib=order.indexOf(b);
    if(ia<0&&ib<0)return a.localeCompare(b,'fa');
    if(ia<0)return 1;if(ib<0)return -1;return ia-ib;
  });

function monthStats(upToJd){
  var len=monthLen(cur.jy,cur.jm),first=j2d(cur.jy,cur.jm,1),due=0,done=0,info={};
  for(var d=1;d<=len;d++){
    var j=first+d-1,ts=tasksDue(j),n=0,m=0;
    ts.forEach(function(it){var c=inst(it,j);n+=c.due;m+=c.done});
    info[d]={due:n,done:m,tasks:ts};
    if(d<=upToJd){due+=n;done+=m}
  }
  return{due:due,done:done,info:info,len:len,first:first};
}

  if(!list.length)return '<option value="">دستگاهی در این سالن نیست</option>';
  return list.map(function(m){return opt(m.id,m.name,m.id===sel)}).join('');

function readTask(p){
  var mid=val(p+'-machine'),title=val(p+'-title');
  if(!mid){notify('اول سالن و دستگاه را انتخاب کنید. دستگاه‌ها را در «تنظیمات» تعریف کنید.',true);return null}
  if(!title){notify('عنوان کار را بنویسید.',true);return null}
  var f=val(p+'-freq'),o={machine:mid,title:title,desc:val(p+'-desc'),type:val(p+'-type'),freq:f,shift:val(p+'-shift')||'any'};
  if(f==='weekly')o.weekday=+val(p+'-wd')||0;
  if(f==='monthly'){o.monthDay=Math.max(1,Math.min(31,+val(p+'-md')||1));o.every=+val(p+'-ev')||1}
  if(f==='daily'||f==='weekly'||f==='monthly'){o.start=readDate(p,'st');if(!o.start){notify('تاریخ شروع درست نیست.',true);return null}}
  if(f==='once'){o.date=readDate(p,'dt');if(!o.date){notify('تاریخ انجام درست نیست.',true);return null}}
  if(f==='range'){
    o.from=readDate(p,'fr');o.to=readDate(p,'to');
    if(!o.from||!o.to){notify('تاریخ‌های بازه درست نیست.',true);return null}
    if(dj(o.to)<dj(o.from)){notify('پایان بازه نمی‌تواند قبل از شروع آن باشد.',true);return null}
  }
  return o;
}
function oneDone(t){
  var d=t.freq==='once'?(t.date&&t.date.d):0,sh=t.shift||'any',sks=sh==='both'?['D','N']:(sh==='D'||sh==='N'?[sh]:['']);
  return sks.every(function(sk){return !!doneVal(t,d,sk)});
}

/* ---------- رندر ---------- */
function editing(){
  var a=document.activeElement;
  return a&&app.contains(a)&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&a.type!=='checkbox';
}
function renderTop(){
  var el=$('#status'),t,c='status',n=outbox.length;
  if(!sb){t='تنظیم نشده';c+=' bad'}
  else if(!session){t='خارج از حساب'}
  else if(errMsg==='readonly'){t='فقط‌خواندنی';c+=' bad'}
  else if(errMsg){t='خطا در ذخیره';c+=' bad'}
  else if(!online){t='آفلاین'+(n?' · '+fa(n)+' تغییر در صف ارسال':' · آخرین داده‌ی ذخیره‌شده');c+=' bad'}
  else if(n){t='در حال ارسال '+fa(n)+' تغییر…'}
  else if(!loadedCfg){t=slow?'اتصال برقرار نشد':'در حال بارگذاری…';if(slow)c+=' bad'}
  else if(!canWrite){t='فقط مشاهده'}
  else{t='همگام'+(lastSync?' · '+timeFa(lastSync):'');c+=' ok'}
  el.textContent=t;el.className=c;
  var out=$('#signout');if(out)out.hidden=!session;
  [['homeBtn','home',true],['manageBtn','manage',canWrite],['settingsBtn','settings',canWrite]].forEach(function(x){
    var b=$('#'+x[0]);if(!b)return;
    b.hidden=!(session&&x[2]);
    if(view===x[1])b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');
  });
}
function render(force){
  if(!force&&(editing()||edit)){dirty=true;return}
  dirty=false;
  renderTop();
  if(!sb){app.innerHTML=viewSetup();return}
  if(!session){app.innerHTML=viewLogin();return}
  var openMs=[].map.call(app.querySelectorAll('details.ms[open]'),function(d){return d.dataset.ms});
  var vw=(!canWrite&&view!=='home')?'home':view;
  app.innerHTML=(VIEWS[vw]||VIEWS.home)();
  openMs.forEach(function(id){var d=app.querySelector('details.ms[data-ms="'+id+'"]');if(d)d.setAttribute('open','')});
  ['nt','et'].forEach(function(p){if($('#'+p+'-freq'))syncFreq(p)});
}
function syncFreq(p){
  var f=$('#'+p+'-freq').value;
  var show={wd:f==='weekly',md:f==='monthly',start:f==='daily'||f==='weekly'||f==='monthly',once:f==='once',range:f==='range',rh:f==='range'};
  Object.keys(show).forEach(function(k){var e=$('#'+p+'-g-'+k);if(e)e.hidden=!show[k]});
}
document.addEventListener('submit',function(e){if(e.target.id==='login-form'){e.preventDefault();signIn()}});
document.addEventListener('click',function(e){
  if(e.target.id==='signout')signOut();
  document.querySelectorAll('details.ms[open]').forEach(function(d){if(!d.contains(e.target))d.removeAttribute('open')});
});
document.addEventListener('focusout',function(){setTimeout(function(){if(dirty&&!editing()&&!edit)render(true)},60)});

/* ---------- رویدادها ---------- */
function val(id){var e=document.getElementById(id);return e?e.value.trim():''}
function renameItem(k,i,nw){
  var old=cfg.lists[k][i];
  cfg.lists[k][i]=nw;
  if(k==='roles')cfg.staff.forEach(function(s){s.roles=rolesOf(s).map(function(x){return x===old?nw:x})});
  if(k==='halls')cfg.machines.forEach(function(m){if(m.hall===old)m.hall=nw});
  if(k==='types')cfg.tasks.forEach(function(t){if(t.type===old)t.type=nw});
}
function saveListEdit(k,i,v){
  v=(v||'').trim().slice(0,60);
  if(!v){notify('نام نمی‌تواند خالی باشد.',true);return}
  if(cfg.lists[k].indexOf(v)>=0&&cfg.lists[k][i]!==v){notify('این گزینه از قبل هست.',true);return}
  mutate(function(){renameItem(k,i,v)});
}
app.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');
  if(!b||b.tagName==='SELECT'||b.tagName==='INPUT')return;
  var act=b.dataset.act;
  if(act==='pick'){selJ=+b.dataset.j;render(true);return}
  if(act==='htab'){homeTab=b.dataset.t;if(homeTab==='today'&&(cur.jy!==tj.jy||cur.jm!==tj.jm)){gotoMonth(tj.jy,tj.jm,todayJ);return}render(true);return}
  if(act==='stab'){setTab=b.dataset.t;edit=null;render(true);return}
  if(act==='mprev'||act==='mnext'){
    var jy=cur.jy,jm=cur.jm+(act==='mnext'?1:-1);
    if(jm>12){jm=1;jy++}if(jm<1){jm=12;jy--}
    gotoMonth(jy,jm,j2d(jy,jm,1));return;
  }
  if(act==='mtoday'){gotoMonth(tj.jy,tj.jm,todayJ);return}
  if(!canWrite)return;
  if(act==='edit'){edit={kind:b.dataset.kind,id:b.dataset.id};render(true);return}
  if(act==='editcancel'){edit=null;render(true);return}
  if(act==='del'){
    if(!b.classList.contains('armed')){
      var old=b.textContent;b.textContent='تأیید حذف';b.classList.add('armed');
      setTimeout(function(){if(b.isConnected){b.textContent=old;b.classList.remove('armed')}},3000);return;
    }
    var id=b.dataset.id,k=b.dataset.kind;
    mutate(function(){
      if(k==='staff')cfg.staff=cfg.staff.filter(function(s){return s.id!==id});
      if(k==='machine'){cfg.machines=cfg.machines.filter(function(m){return m.id!==id});cfg.tasks=cfg.tasks.filter(function(t){return t.machine!==id})}
      if(k==='task')cfg.tasks=cfg.tasks.filter(function(t){return t.id!==id});
      if(k==='team'){cfg.teams=cfg.teams.filter(function(t){return t.id!==id});cfg.staff.forEach(function(s){if(s.team===id)s.team=''})}
      if(k==='listitem'&&cfg.lists[b.dataset.list])cfg.lists[b.dataset.list].splice(+b.dataset.i,1);
    });
    return;
  }
  if(act==='addstaff'){
    var sv=readStaff('ns');if(!sv)return;
    var dd=document.querySelector('details[data-ms="ms-ns"]');if(dd)dd.removeAttribute('open');
    mutate(function(){cfg.staff.push(Object.assign({id:uid()},sv))});return;
  }
  if(act==='savestaff'){
    var sv2=readStaff('es');if(!sv2)return;
    mutate(function(){var s=cfg.staff.find(function(q){return q.id===b.dataset.id});if(s)Object.assign(s,sv2)});return;
  }
  if(act==='addmachine'){
    var mn=val('nm-name');if(!mn){notify('نام دستگاه را بنویسید.',true);return}
    mutate(function(){cfg.machines.push({id:uid(),name:mn,hall:val('nm-hall')})});return;
  }
  if(act==='savemachine'){
    var en=val('em-name');if(!en){notify('نام دستگاه را بنویسید.',true);return}
    mutate(function(){var m=machineOf(b.dataset.id);if(m){m.name=en;m.hall=val('em-hall')}});return;
  }
  if(act==='addtask'){
    var tv=readTask('nt');if(!tv)return;
    mutate(function(){cfg.tasks.push(Object.assign({id:uid()},tv))});return;
  }
  if(act==='savetask'){
    var tv2=readTask('et');if(!tv2)return;
    mutate(function(){var i=cfg.tasks.findIndex(function(q){return q.id===b.dataset.id});if(i>=0)cfg.tasks[i]=Object.assign({id:b.dataset.id},tv2)});return;
  }
  if(act==='lstadd'){
    var lk=b.dataset.list,inp=document.getElementById('ls-'+lk),tv3=inp?inp.value.trim().slice(0,60):'';
    if(!tv3||!cfg.lists[lk])return;
    if(cfg.lists[lk].indexOf(tv3)>=0){notify('این گزینه از قبل هست.',true);return}
    if(cfg.lists[lk].length>=100){notify('حداکثر ۱۰۰ گزینه مجاز است.',true);return}
    mutate(function(){cfg.lists[lk].push(tv3)});return;
  }
  if(act==='lstsave'){saveListEdit(b.dataset.list,+b.dataset.i,val('le-input'));return}
  if(act==='cyc'){
    var i=+b.dataset.i,nx={D:'N',N:'O',O:'D'};
    mutate(function(){var c=cfg.cycle.split('');c[i]=nx[c[i]]||'D';cfg.cycle=c.join('')});return;
  }
  if(act==='cycadd'){if(cfg.cycle.length<14)mutate(function(){cfg.cycle+='O'});return}
  if(act==='cycdel'){if(cfg.cycle.length>2)mutate(function(){cfg.cycle=cfg.cycle.slice(0,-1)});return}
  if(act==='addteam'){mutate(function(){cfg.teams.push({id:uid(),name:'تیم '+fa(cfg.teams.length+1),off:0})});return}
});
app.addEventListener('change',function(e){
  var el=e.target,act=el.dataset.act;
  if(!act)return;
  if(act==='freqsel'){syncFreq(el.id.slice(0,2));return}
  if(act==='taskhall'){
    var p=el.id.slice(0,2),ms=document.getElementById(p+'-machine');
    if(ms)ms.innerHTML=machineOptions(el.value,'');return;
  }
  if(act==='kindsel'){
    var tm=document.getElementById(el.id.slice(0,2)+'-team');if(tm)tm.disabled=el.value==='day';return;
  }
  if(act==='msform'){
    var d1=el.closest('details'),v1=msChecked(d1);d1.querySelector('.ms-t').textContent=v1.length?v1.join('، '):MS_PH;return;
  }
  if(!canWrite){if(el.type==='checkbox')el.checked=!el.checked;return}
  if(act==='tick'){
    var kk=el.dataset.key,dk='d:'+kk,doc=el.dataset.doc||curDoc(),stt=stateFor(doc);
    if(el.checked){var sv={by:userName(),at:new Date().toISOString()};stt.done[kk]=sv;var o1={};o1[dk]=sv;patchMonth(o1,[],doc)}
    else{delete stt.done[kk];patchMonth({},[dk],doc)}
    render(true);return;
  }
  if(act==='ovr'){
    var x=d2j(+el.dataset.j),k=x.jd+'_'+el.dataset.s,ok='o:'+k;
    if(el.value){monthState.ovr[k]=el.value;var o2={};o2[ok]=el.value;patchMonth(o2,[])}
    else{delete monthState.ovr[k];patchMonth({},[ok])}
    render(true);return;
  }
  if(act==='teamname'){var t=teamOf(el.dataset.id);if(t&&el.value.trim()){var nm=el.value.trim();mutate(function(){t.name=nm})}return}
  if(act==='teamoff'){var t2=teamOf(el.dataset.id);if(t2){var ov=+el.value;mutate(function(){t2.off=ov})}return}
  if(act==='anchor'){
    var y=+val('an-y'),m=+val('an-m'),d=+val('an-d');
    if(y>1300&&y<1600&&m>=1&&m<=12&&d>=1&&d<=31)mutate(function(){cfg.anchor={y:y,m:m,d:d}});
    return;
  }
});
app.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&e.target.id&&e.target.id.indexOf('ls-')===0){
    e.preventDefault();
    var bt=app.querySelector('[data-act="lstadd"][data-list="'+e.target.id.slice(3)+'"]');
    if(bt)bt.click();
  }
  if(e.target.id==='le-input'){
    if(e.key==='Enter'){e.preventDefault();saveListEdit(e.target.dataset.list,+e.target.dataset.i,e.target.value)}
    if(e.key==='Escape'){edit=null;render(true)}
  }
});

/* ---------- مسیریابی ---------- */
function route(){
  var h=(location.hash||'').replace('#','');
  var map={today:'home',month:'home',pm:'manage',staff:'settings',shifts:'settings'};
  if(h==='month'||h==='today')homeTab=h;
  if(h==='staff'||h==='shifts')setTab=h;
  var v=map[h]||h;
  view=VIEWS_ORDER.indexOf(v)>=0?v:'home';
  edit=null;
  if(view==='home'&&homeTab==='today'&&(cur.jy!==tj.jy||cur.jm!==tj.jm)){cur={jy:tj.jy,jm:tj.jm};selJ=todayJ;watchMonth()}
  render(true);
}
window.addEventListener('hashchange',route);

/* ---------- شروع ---------- */
function boot(){
  var l=lsGet(CFGKEY);if(l&&l.data){cfg=normalize(l.data);cfgVer=l.ver||null;calcAnchor()}
  loadOutbox();
  watchMonth();
  window.addEventListener('online',function(){online=true;flush().then(refresh)});
  window.addEventListener('offline',function(){online=false;renderTop()});
  document.addEventListener('visibilitychange',function(){if(!document.hidden)flush().then(refresh)});
  if(!CFGKEYS.SUPABASE_URL||!CFGKEYS.SUPABASE_ANON_KEY||!window.supabase){render(true);return}
  sb=window.supabase.createClient(CFGKEYS.SUPABASE_URL,CFGKEYS.SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
  sb.auth.onAuthStateChange(function(ev,s){
    if(ev==='INITIAL_SESSION'||ev==='SIGNED_IN'||ev==='SIGNED_OUT')startSession(s);
  });
  setTimeout(function(){if(!loadedCfg&&session){slow=true;renderTop()}},10000);
  render(true);
}
route();
boot();
})();

</script>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
</script>
